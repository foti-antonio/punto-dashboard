<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#185943" />
    <meta
      name="description"
      content="Punto: a space for your projects, tasks and financial peace of mind."
    />
    <title>Punto · Personal dashboard</title>
    <script>
      // Resolve the browser preference before styles or React can paint.
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('punto-theme');
          if (saved === 'light' || saved === 'dark') preference = saved;
        } catch {}
        const theme =
          preference === 'system'
            ? window.matchMedia?.('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/src/theme.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
